<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루의 음악">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>하루의 음악 v2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f4f4f7;color:#171719;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;padding:16px}
.wrap{max-width:560px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
h1{font-size:25px;margin:0}.ver{font-size:10px;color:#888;margin-top:3px}.badge{font-size:10px;background:#fff;border-radius:999px;padding:8px 10px}
.card{background:#fff;border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 10px 35px rgba(0,0,0,.06)}
.art{aspect-ratio:1;border-radius:22px;background:linear-gradient(145deg,#ffc9d3,#ffe0b9,#c6e3ff,#dccfff);display:grid;place-items:center;font-size:58px}
.title{font-size:22px;font-weight:800;margin:15px 0 5px}.meta{font-size:12px;color:#777}
.primary{width:100%;border:0;background:#171719;color:#fff;border-radius:17px;padding:15px;font-size:16px;font-weight:800;margin-top:14px}
.test{width:100%;border:1px solid #ddd;background:#fff;border-radius:15px;padding:12px;font-size:12px;font-weight:750;margin-top:8px}
.controls{display:flex;align-items:center;justify-content:center;gap:15px;margin:12px 0}.controls button{border:0;background:#ededf2;width:58px;height:58px;border-radius:50%;font-size:24px}.controls .play{width:72px;height:72px;background:#171719;color:#fff}
.status{background:#f0f0f3;border-radius:13px;padding:10px 12px;font-size:11px;line-height:1.55}.ok{color:#127c38}.bad{color:#b42318}
h2{font-size:16px;margin:0 0 12px}.genres{display:grid;grid-template-columns:1fr 1fr;gap:8px}.genre{border:1px solid #ddd;background:#fff;border-radius:15px;padding:12px;text-align:left}.genre b{display:block;font-size:12px}.genre span{font-size:10px;color:#888}.genre.on{background:#171719;color:#fff}.genre.on span{color:#bbb}.all{grid-column:1/-1}
.vol{display:flex;gap:10px;align-items:center;margin-top:12px}.vol input{width:100%}
.note{font-size:10.5px;color:#777;line-height:1.65;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>하루의 음악</h1><div class="ver">AUDIO FIX v2 · GitHub Pages</div></div><div class="badge">200 TRACKS</div></div>

<div class="card">
 <div class="art" id="art">♪</div>
 <div class="title" id="trackTitle">오늘의 랜덤 플레이</div>
 <div class="meta" id="trackMeta">먼저 ‘소리 테스트’를 눌러 소리가 나는지 확인하세요.</div>
 <button class="test" id="testBtn">🔊 소리 테스트</button>
 <button class="primary" id="startBtn">음악 시작</button>
 <div class="controls"><button id="prevBtn">‹</button><button class="play" id="playBtn">▶</button><button id="nextBtn">›</button></div>
 <div class="vol"><span style="font-size:11px">볼륨</span><input id="volume" type="range" min="0" max="100" value="85"></div>
 <div class="status" id="status">상태: 준비 완료</div>
</div>

<div class="card">
<h2>장르 선택</h2>
<div class="genres">
 <button class="genre all on" data-genre="all"><b>모든 장르 섞기</b><span>총 200곡</span></button>
 <button class="genre on" data-genre="classic"><b>♩ 클래식</b><span>40곡</span></button>
 <button class="genre on" data-genre="cinema"><b>◌ 시네마틱 OST풍</b><span>40곡</span></button>
 <button class="genre on" data-genre="anime"><b>✧ 애니메이션 OST풍</b><span>40곡</span></button>
 <button class="genre on" data-genre="ballad"><b>♡ 발라드풍</b><span>40곡</span></button>
 <button class="genre on" data-genre="bright"><b>☀ 경쾌한 음악</b><span>40곡</span></button>
</div>
<p class="note">소리 테스트가 들리는데 음악만 안 들리면 화면의 상태 문구를 확인하세요. 소리 테스트도 안 들리면 iPhone 측면 무음 스위치/미디어 음량/블루투스 출력 장치를 확인해야 합니다.</p>
</div>
</div>

<audio id="fallbackAudio" src="./audio/test.wav" preload="auto" playsinline></audio>

<script>
(function(){
"use strict";
var AudioCtx=window.AudioContext||window.webkitAudioContext;
var ctx=null,master=null,timer=null,playing=false,current=null,beatIndex=0,nextTime=0;
var selected={classic:true,cinema:true,anime:true,ballad:true,bright:true},history=[];
var keys=["classic","cinema","anime","ballad","bright"];
var G={
 classic:{name:"클래식",bpm:68,scale:[0,2,4,5,7,9,11],wave:"triangle"},
 cinema:{name:"시네마틱 OST풍",bpm:62,scale:[0,2,3,5,7,8,10],wave:"sine"},
 anime:{name:"애니메이션 OST풍",bpm:84,scale:[0,2,4,7,9],wave:"triangle"},
 ballad:{name:"발라드풍",bpm:72,scale:[0,2,4,5,7,9,11],wave:"sine"},
 bright:{name:"경쾌한 음악",bpm:102,scale:[0,2,4,7,9],wave:"triangle"}
};
var A=["고요한","따뜻한","은은한","포근한","맑은","느린","반짝이는","부드러운","평온한","작은"];
var N=["창가","오후","정원","구름","산책","빛","물결","기억","하늘","쉼"];
var tracks=[];
for(var gi=0;gi<5;gi++)for(var i=0;i<40;i++)tracks.push({id:gi*40+i+1,genre:keys[gi],title:A[(i+gi*2)%10]+" "+N[(i*3+gi)%10]+" "+("0"+(i+1)).slice(-2),bpm:G[keys[gi]].bpm+((i*7+gi*3)%13)-6,root:48+((i+gi)%7)});
function el(id){return document.getElementById(id)}
function hz(m){return 440*Math.pow(2,(m-69)/12)}
function stat(s,ok){var x=el("status");x.textContent="상태: "+s+(ctx?" · AudioContext "+ctx.state:"");x.className="status "+(ok?"ok":"bad")}
function init(){
 if(ctx)return true;
 if(!AudioCtx){stat("Web Audio 미지원",false);return false}
 try{
   ctx=new AudioCtx();
   master=ctx.createGain();
   master.gain.value=Number(el("volume").value)/100*0.75;
   master.connect(ctx.destination);
   return true;
 }catch(e){stat("AudioContext 생성 실패: "+e.message,false);return false}
}
function tone(freq,when,dur,gain,wave){
 var o=ctx.createOscillator(),g=ctx.createGain();
 o.type=wave||"sine";o.frequency.setValueAtTime(freq,when);
 g.gain.setValueAtTime(.0001,when);
 g.gain.exponentialRampToValueAtTime(gain,when+.015);
 g.gain.exponentialRampToValueAtTime(.0001,when+dur);
 o.connect(g);g.connect(master);o.start(when);o.stop(when+dur+.03)
}
function unlock(){
 if(!init())return Promise.reject(new Error("init failed"));
 return Promise.resolve(ctx.resume?ctx.resume():null).then(function(){
   var t=ctx.currentTime+.03;
   tone(523.25,t,.12,.14,"sine");
   stat("오디오 잠금 해제 성공",true);
 })
}
function testSound(){
 var a=el("fallbackAudio");
 a.currentTime=0;a.volume=1;
 var p=a.play();
 if(p&&p.then)p.then(function(){stat("테스트 WAV 재생 성공",true)}).catch(function(){
   unlock().catch(function(){stat("테스트 재생 실패",false)})
 });
 else stat("테스트 WAV 재생 요청",true)
}
function avail(){return tracks.filter(function(t){return selected[t.genre]})}
function pick(){var a=avail();return a[Math.floor(Math.random()*a.length)]||tracks[0]}
function setTrack(t){
 if(current)history.push(current);current=t;beatIndex=0;
 el("trackTitle").textContent=t.title;el("trackMeta").textContent=G[t.genre].name+" · "+t.bpm+" BPM · 오리지널 연주";
 var c={classic:"#d9dbef",cinema:"#b9c8df",anime:"#ffd2e2",ballad:"#e8d9d2",bright:"#ffe0a3"}[t.genre];
 el("art").style.background="linear-gradient(145deg,"+c+",#fff,#cfe0ff)"
}
function schedule(){
 if(!playing||!ctx||!current)return;
 var ge=G[current.genre],beat=60/current.bpm;
 while(nextTime<ctx.currentTime+2.0){
   var sc=ge.scale,b=beatIndex,root=current.root,w=nextTime;
   if(b%4===0){
     tone(hz(root),w,beat*1.7,.10,"sine");
     tone(hz(root+12+sc[0]),w,beat*1.35,.065,ge.wave);
     tone(hz(root+12+sc[2%sc.length]),w,beat*1.35,.05,ge.wave);
     tone(hz(root+12+sc[4%sc.length]),w,beat*1.35,.045,ge.wave);
   }
   tone(hz(root+24+sc[(b+current.id)%sc.length]),w+beat*.08,beat*.50,.045,ge.wave);
   nextTime+=beat;beatIndex++;
   if(beatIndex>160)setTrack(pick())
 }
}
function startMusic(){
 unlock().then(function(){
   if(!current)setTrack(pick());
   playing=true;el("playBtn").textContent="❚❚";
   nextTime=ctx.currentTime+.20;
   clearInterval(timer);timer=setInterval(schedule,400);schedule();stat("음악 재생 중",true)
 }).catch(function(e){stat("음악 시작 실패: "+e.message,false)})
}
function pause(){playing=false;clearInterval(timer);el("playBtn").textContent="▶";if(ctx&&ctx.suspend)ctx.suspend();stat("일시정지",true)}
function next(){if(!current)setTrack(pick());else setTrack(pick());if(playing){nextTime=ctx.currentTime+.1;schedule()}else startMusic()}
function prev(){if(history.length){current=history.pop();beatIndex=0;el("trackTitle").textContent=current.title;el("trackMeta").textContent=G[current.genre].name+" · "+current.bpm+" BPM";if(!playing)startMusic()}}
function updateAll(){var all=true;keys.forEach(function(k){if(!selected[k])all=false});document.querySelector('[data-genre="all"]').classList.toggle("on",all)}
document.querySelectorAll(".genre").forEach(function(b){b.addEventListener("click",function(){
 var g=this.getAttribute("data-genre");
 if(g==="all"){keys.forEach(function(k){selected[k]=true});document.querySelectorAll(".genre").forEach(function(x){x.classList.add("on")});return}
 var n=0;keys.forEach(function(k){if(selected[k])n++});if(selected[g]&&n===1)return;
 selected[g]=!selected[g];this.classList.toggle("on",selected[g]);updateAll()
})});
el("testBtn").onclick=testSound;
el("startBtn").onclick=startMusic;
el("playBtn").onclick=function(){playing?pause():startMusic()};
el("nextBtn").onclick=next;el("prevBtn").onclick=prev;
el("volume").oninput=function(){if(master)master.gain.value=Number(this.value)/100*.75};

if("serviceWorker" in navigator){
 window.addEventListener("load",function(){
   navigator.serviceWorker.register("./sw.js?v=2").then(function(r){r.update()}).catch(function(){})
 })
}
stat("준비 완료 — 소리 테스트를 눌러주세요",true);
})();
</script>
</body>
</html>
